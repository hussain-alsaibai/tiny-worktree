name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor declared in pyproject.toml, so that is where the
        # matrix starts. A declared floor that is never exercised is a
        # claim, not a guarantee.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - name: ruff check
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify the wheel actually ships the module
        # A wheel whose RECORD contains only dist-info installs nothing.
        # Assert the module is in the wheel, not just that the build passed.
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel produced"
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert any(n.endswith("tiny_worktree/__init__.py") for n in names), names
          print("wheel ships:", sorted(n for n in names if n.endswith(".py")))
          PY
      - name: twine check
        run: python -m twine check dist/*
